name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privacy:
    name: Privacy and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run scanner tests
        run: make test

      - name: Scan files and reachable history
        run: make privacy-history

  latex:
    name: XeLaTeX themes
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install TeX and PDF tools
        run: |
          # GitHub's Azure mirror can stall indefinitely while reading package
          # indexes. Pin Ubuntu's canonical archive and bound network retries.
          echo 'https://archive.ubuntu.com/ubuntu' \
            | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          apt_options=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
          )
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install --no-install-recommends -y \
            fonts-noto-cjk \
            fonts-texgyre \
            ghostscript \
            poppler-data \
            poppler-utils \
            texlive-fonts-recommended \
            texlive-lang-chinese \
            texlive-latex-extra \
            texlive-xetex

      - name: Compile and verify every theme
        run: make build

      - name: Run adaptive layout regression
        run: make layout-test
